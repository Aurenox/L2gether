<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Vibrant Link Gradient 1 (Indigo to Purple) -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Vibrant Link Gradient 2 (Purple to Pink/Coral) -->
    <linearGradient id="twoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Core Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="32" cy="32" r="26" fill="url(#ambientGlow)" />

  <!-- Collaborative Connected Loop / 'L' + '2' Infinity Knot -->
  <g filter="url(#glow)">
    <!-- Primary Flow Loop (The L-arm linking into the 2-curve) -->
    <path
      d="M18 16 C18 14.5 19.5 13.5 21 14.5 L24 16.5 C26 18 26 21 26 24 L26 36 C26 40 29 43 33 43 L45 43 C47 43 48 45 47 47 L45 49 C43.5 50.5 41 51 38 51 L25 51 C19.5 51 15 46.5 15 41 L15 19 C15 17.5 16.5 16 18 16 Z"
      fill="url(#lGrad)"
    />

    <!-- Interlocking 2-arch & Forward Loop -->
    <path
      d="M32 15 C38 15 46 18 47 25 C48 31 42 36 37 40 L34 42 C38 42 45 41 49 39 C50.5 38.5 52 40 51 41.5 L49.5 43.5 C46.5 47 41 49 35 49 C33 49 31 48 31 46 C31 43.5 33 41 36 38.5 C41 34.5 43 31.5 42 27 C41 22.5 36.5 20 32 20 C28.5 20 25.5 21.5 24 23.5 L21.5 21 C24 17.5 27.5 15 32 15 Z"
      fill="url(#twoGrad)"
    />

    <!-- Code Connection Spark / Synchronized Core Node -->
    <circle cx="33" cy="43" r="3" fill="#FFFFFF" />
    <circle cx="33" cy="43" r="5" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" />

    <!-- Upper Synchronized Node -->
    <circle cx="47" cy="25" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
